[project]
name = "smartphone-addiction-warning-system"
version = "1.1.0"
description = "Behavioural risk scoring, cohort percentile benchmarking and ranked habit interventions for teen smartphone usage."
requires-python = ">=3.11"

# Runtime dependencies only - what serving a prediction needs, and nothing else.
# Mirrors requirements.txt; the training and notebook extras live in
# requirements-dev.txt and are deliberately absent here, because a deployment
# installs this list and every megabyte counts against the function bundle.
#
# `xgboost` is *not* here on purpose. `Src/inference.py` never imports it at
# module scope and `App/dependencies.get_scorer` only touches it if a request
# asks for `xgb`, so a deployment without it serves the `gb` default happily and
# answers 503 for `xgb` - which `GET /api/models` reports up front. It is ~110MB
# installed, the single largest item in the tree, and it buys 0.02 MSE.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.4",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "joblib==1.4.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "SQLAlchemy==2.0.52",
]

[project.optional-dependencies]
# `pip install -e .[dev]` is equivalent to `pip install -r requirements-dev.txt`.
dev = [
    "xgboost==3.1.2",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "jupyterlab==4.4.3",
    "notebook==7.4.3",
    "ipykernel==6.29.5",
]

# --------------------------------------------------------------------------- #
# Vercel
# --------------------------------------------------------------------------- #
# The FastAPI instance does not sit at a filename Vercel auto-detects
# (app.py / index.py / server.py / main.py / wsgi.py / asgi.py, optionally under
# src/ or app/). `main.py` at the repo root *is* on that list but is the CLI
# entry point - it has no ASGI app - which is why the build failed with
# "Found main.py but it does not define a top-level app FastAPI instance".
#
# Point it at the real one. Note the capital A: the package directory is `App/`,
# and Vercel builds on Linux, where that is not the same as `app/`.
[tool.vercel]
entrypoint = "App.Api:app"
